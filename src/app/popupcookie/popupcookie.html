@if (cookieService.bandeauVisible()) {
  <div class="cookie-overlay">
    <div class="cookie-cadre">
      <h3>Gestion des cookies 🍪</h3>
      <p>
        Pour protéger ce site contre le spam, nous utilisons le service de sécurité hCaptcha.
        Acceptez-vous l'utilisation des cookies strictement liés à ce service ?
      </p>
      <div class="cookie-actions">
        <button class="btn-refuser" (click)="cookieService.refuser()">Refuser</button>
        <button class="btn-accepter" (click)="cookieService.accepter()">Accepter</button>
      </div>
    </div>
  </div>
}
